# La suite de Tcode en cada cambio.
#
# `rapido` corre en cada push y en cada pull request: las secciones que
# prueban el lenguaje con `tcodec`, y una pasada corta de las propiedades.
# Unos minutos.
#
# `completa` es `make check` entera, unos cinco minutos: en cada pull request,
# en `main` y cuando se pide a mano. Tambien comprueba que las cifras del
# README sean las que mide la suite.
name: suite

on:
  push:
  pull_request:
  workflow_dispatch:
  # El fuzzing largo, cada noche.
  schedule:
    - cron: "17 3 * * *"

# Un push nuevo a la misma rama deja viejo al anterior.
concurrency:
  group: suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rapido:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Con la aleatorizacion de direcciones al maximo, AddressSanitizer no
      # encuentra donde poner su memoria sombra en algunos nucleos.
      - name: sitio para AddressSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - uses: actions/cache@v4
        with:
          path: .cache/herramientas
          key: herramientas-${{ runner.os }}-${{ github.sha }}
          restore-keys: herramientas-${{ runner.os }}-
      - name: ruff y mypy
        run: pip install ruff==0.15.8 mypy==1.19.1 && make lint
      # Solo un compilador de C: la semilla construye el `tcodec` de ahora.
      - name: tcodec desde su semilla
        run: make tcodec && make ejemplos
      - name: secciones rapidas
        run: make rapido
      - name: propiedades, una pasada corta
        run: make propiedades
        env:
          TCODE_PROGRAMAS: "10"

  completa:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: sitio para AddressSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      # Las herramientas que compila la suite, guardadas por el hash de su C:
      # las que un cambio no toca no se vuelven a compilar.
      - uses: actions/cache@v4
        with:
          path: .cache/herramientas
          key: herramientas-${{ runner.os }}-${{ github.sha }}
          restore-keys: herramientas-${{ runner.os }}-
      - name: ruff y mypy
        run: pip install ruff==0.15.8 mypy==1.19.1
      - name: make check
        run: make check
      # Razones, no segundos: Tcode / C en cada caso, y el compilador en
      # unidades de la misma maquina. Los limites, en `bench/limites.json`.
      - name: medidas dentro de sus limites
        run: make bench-comprobar

  # C17 portable, comprobado: con cada compilador, la semilla compila sin
  # avisos, se reproduce byte a byte, y pasan las secciones rapidas.
  compiladores:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc-12, gcc-13, gcc-14, clang-16, clang-17, clang-18]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: sitio para AddressSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: ${{ matrix.cc }}
        run: make compiladores COMPILADORES=${{ matrix.cc }}

  # Otro sistema: en macOS, con el clang de Apple, todo compila sin avisos,
  # tcodec reproduce su C byte a byte, y los ejemplos compilan y corren.
  macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: sin avisos, y punto fijo
        run: make punto-fijo-cc
      - name: tcodec desde su semilla, y los ejemplos
        run: make tcodec && make ejemplos

  # Media hora rompiendo el codigo del repositorio al azar. Lo que falle se
  # guarda reducido en `tests/fuzz/hallazgos/`, y queda aqui para bajarlo y
  # anadirlo como regresion.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: sitio para AddressSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: fuzz
        run: make fuzz FUZZ_SEGUNDOS=1800
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hallazgos
          path: tests/fuzz/hallazgos/
      - name: fuzz del runtime (libFuzzer)
        run: make fuzz-safestr CLANG=clang-18 FUZZ_RUNTIME_SEGUNDOS=600
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hallazgos-runtime
          path: .cache/safestr-hallazgos/

  # La red que rompe reglas a proposito: una mutacion por familia, y la suite
  # tiene que cazar cada una. Va en su propio job porque son ~15 minutos con
  # cuatro obreros, y sumados a los 40 del fuzzer no caben en un timeout.
  # Una red que no se ejecuta no es una red: si un mutante sobrevive, esto
  # falla, y el mutante vive en `tests/mutar.py`.
  mutar:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: sitio para AddressSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: las mutaciones, y que ninguna sobreviva
        run: make mutar
