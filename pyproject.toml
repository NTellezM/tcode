# Solo configuracion de herramientas (ruff y mypy) para las suites.

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".cache"]

[tool.ruff.lint]
# pycodestyle, pyflakes y bugbear: lo que suele ser un fallo de verdad.
select = ["E", "F", "W", "B"]
# `zip(a, b)` sin `strict=`: aqui se usa a proposito para comparar hasta la
# primera diferencia entre dos listas de largo distinto.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Las suites se ejecutan como programas: ponen la raiz en `sys.path` antes
# de importar el compilador.
"tests/*.py" = ["E402"]
"bench/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["tests"]

# `coverage` es opcional: lo pide `make cobertura`, la suite no, y en la CI no
# esta instalado. Sin esto, mypy no sabe de que tipo es y falla el lint.
[[tool.mypy.overrides]]
module = "coverage"
ignore_missing_imports = true
